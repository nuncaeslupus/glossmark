name: release

# A `v*` tag builds every OS's bundles into one draft Release (S-4 T1). The Release stays a draft:
# the install smoke jobs (T2) un-draft it. Bundles are unsigned for now (D-24); macOS is ad-hoc
# signed (`signingIdentity "-"`) so Apple Silicon runs it.
# tag.yml dispatches it on the tag it pushes: a tag pushed with GITHUB_TOKEN triggers no `push` run.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}

permissions:
  contents: write

jobs:
  # One draft created up front, so the parallel builds upload into it instead of racing to create it.
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      release-id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_release.sh --version-only "$GITHUB_REF_NAME"
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=false
          [[ $GITHUB_REF_NAME == *-* ]] && prerelease=true
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$GITHUB_REF_NAME" \
            -f name="Glossmark $GITHUB_REF_NAME" -F draft=true -F prerelease="$prerelease" --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: --bundles deb,appimage
          - os: windows-latest
            args: --bundles msi,nsis
          - os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # linuxdeploy is itself an AppImage; the runner has no libfuse2, so extract it instead of mounting.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v4
      # Same apt workaround as ci.yml: man-db's trigger can stall apt on ubuntu-24.04 runners.
      - if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: release
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.draft.outputs.release-id }}
          args: ${{ matrix.args }}

  # Fails when any bundle is missing; the size table goes to the job summary.
  assets:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/check_release.sh "$GITHUB_REF_NAME" | tee -a "$GITHUB_STEP_SUMMARY"
