name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # man-db's trigger can stall apt on ubuntu-24.04 runners, and the mirror is sometimes
      # slow; the packages are cached so only a cold run downloads them.
      - run: sudo rm -f /var/lib/man-db/auto-update
      - uses: awalsh128/cache-apt-pkgs-action@v1
        timeout-minutes: 20
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: make lint test
